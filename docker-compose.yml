services:
  open-webui:
    build: .
    container_name: open-webui
    ports:
      - "3000:8080"  # Web interface (http://localhost:3000)
    environment:
      #can change these settings in the Open WebUI Admin Panel
      - OLLAMA_BASE_URL=http://localhost:11434
      - WEBUI_AUTH=False  # Disable authentication for simplicity (enable if needed)
      - WEBUI_SECRET_KEY=temporary-secret-key-change-me  # Change this!
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=admin
      - RAG_EMBEDDING_ENGINE=ollama  # Use Ollama for embeddings
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest
      - RAG_TOP_K=15  # Number of relevant chunks to retrieve
      - RAG_RELEVANCE_THRESHOLD=0.3  # Include all retrieved chunks
      - CONTENT_EXTRACTION_ENGINE=tika  # PDF/document parsing

      - GLOBAL_LOG_LEVEL=DEBUG

    volumes:
      - open-webui_data:/app/backend/data  # Chat history and document metadata
      - ./custom_scripts:/app/custom_scripts
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For Tika connectivity if needed

